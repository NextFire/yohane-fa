[project]
name = "yohane-fa"
dynamic = ["version"]
description = "Custom forced alignement model for yohane"
readme = "README.md"
license = "AGPL-3.0-only"
authors = [{ name = "NextFire", email = "git@yuru.moe" }]
requires-python = ">=3.14"
dependencies = [
    "kernels==0.14.1",
    "lightning==2.6.1",
    "tokenizers==0.22.2",
    "transformers==5.8.1",
]

[project.optional-dependencies]
torch = [
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "torchcodec==0.11.1",
    "torchvision==0.26.0",
]

[dependency-groups]
dev = [
    "datasets==4.8.5",
    "ipykernel==7.2.0",
    "ipywidgets==8.1.8",
    "lightning[extra]==2.6.1",
    "trackio[apple-gpu,gpu]==0.25.1",
]

# [tool.uv.sources]
# torch = { index = "pytorch-cu128" }
# torchcodec = { index = "pytorch-cu128" }
# torchvision = { index = "pytorch-cu128" }

# [[tool.uv.index]]
# name = "pytorch-cu128"
# url = "https://download.pytorch.org/whl/cu128"
# explicit = true

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
